name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate md2md content
        run: npm run validate

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Check worker build
        run: npm run check
        working-directory: worker
